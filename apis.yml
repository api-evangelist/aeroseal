aid: aeroseal
name: Aeroseal
description: 'Aeroseal is a building-envelope and duct air-sealing technology company
  headquartered in Miamisburg, Ohio. Its patented aerosol sealing process — developed
  by Dr. Mark Modera under U.S. Department of Energy research at Lawrence Berkeley
  National Laboratory beginning in 1993 and commercialized as Aeroseal in 2010 — injects
  a fog of non-toxic sealant particles into a pressurized duct system or building
  envelope, where the particles collect at the edges of leaks and seal them from the
  inside. The company sells computer-controlled sealing equipment and software to a
  dealer network under the HomeSeal Connect and AeroBarrier Connect product lines;
  the on-machine software measures leakage in real time and issues a certificate of
  completion showing before-and-after leakage rates. Aeroseal reports operations in
  27 countries and all 50 U.S. states, and has raised roughly $119M across three
  rounds, including a $67M Series B in July 2023 backed by Breakthrough Energy
  Ventures, Climate Investment and OGCI. It is an equipment, materials and
  contractor-software business rather than a developer platform: it publishes no
  public API, developer portal, SDK or machine-readable specification.'
